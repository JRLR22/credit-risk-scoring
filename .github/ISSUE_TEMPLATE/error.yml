name: Error
description: Algo no funciona como se espera.
labels: ["error"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué pasa y qué se esperaba que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
  - type: textarea
    id: logs
    attributes:
      label: Logs o salida relevante
      render: shell
